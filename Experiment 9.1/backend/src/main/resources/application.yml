server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/socialdb}
    username: ${DB_USER:social}
    password: ${DB_PASSWORD:socialpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
app:
  jwt-secret: ${JWT_SECRET:local-only-change-this-secret-to-a-long-random-value-123456}
  jwt-expiration-ms: 86400000
  scheduling:
    fixed-delay-ms: 30000

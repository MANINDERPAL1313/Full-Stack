name: Full-stack CI
on:
  push:
    paths: ['Experiment 9.1/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['Experiment 9.1/**', '.github/workflows/ci.yml']
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Experiment 9.1/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Experiment 9.1/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Experiment 9.1/frontend/package.json
      - run: npm install
      - run: npm run build

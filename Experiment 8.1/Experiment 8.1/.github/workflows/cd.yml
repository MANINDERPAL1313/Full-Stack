name: CD - Docker release and canary
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-lab
          tags: type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  canary-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy canary on remote Docker host
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "docker pull $IMAGE && docker rm -f ci-cd-canary || true; docker run -d --name ci-cd-canary -p 8081:8080 $IMAGE"
          sleep 15
          curl --fail "http://$HOST:8081/api/products"
          echo 'Canary smoke test passed. Promote traffic to this release using your reverse proxy/load balancer.'
